<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIFELINE INVESTMENTS</title>
<style>
body{background:#0a0a0a;color:white;font-family:Arial;text-align:center;padding:20px}
.green{color:#00ff88}.red{color:#ff4444}
.card{background:#1a1a1a;padding:15px;border-radius:10px;margin:15px 0;text-align:left}
input{width:90%;padding:12px;margin:8px 0;border-radius:5px;border:none}
.btn{background:#00ff88;color:black;padding:12px;border:none;border-radius:5px;font-weight:bold;width:95%;cursor:pointer}
</style>
</head>
<body>
<h1 class="green">LIFELINE INVESTMENTS</h1>
<div class="card">
<h3>Create Account</h3>
<input id="name" placeholder="Full Name">
<input id="phone" placeholder="Phone 07...">
<input id="password" type="password" placeholder="Password">
<input id="referral" placeholder="Referral Code (optional)">
<button class="btn" onclick="register()">Register Now</button>
<p id="msg"></p>
</div>
<script>
const API="https://lifeline-investments-production.up.railway.app/api/auth/register"
async function register(){
  const name=document.getElementById('name').value.trim()
  const phone=document.getElementById('phone').value.trim()
  const password=document.getElementById('password').value.trim()
  const referral=document.getElementById('referral').value.trim()
  if(!name||!phone||!password){alert("Fill all");return}
  document.getElementById('msg').innerText="Creating..."
  try{
    const res=await fetch(API,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name,phone,password,referralCode:referral})
    })
    const data=await res.json()
    if(res.ok){
      alert("SUCCESS! Account created: "+phone)
      document.getElementById('msg').innerText="Success! "+phone+" created"
    }else{
      alert("Error: "+(data.message||JSON.stringify(data)))
      document.getElementById('msg').innerText=""
    }
  }catch(e){
    alert("Fetch failed: "+e.message+"\n\nIf CORS error, go to Railway backend logs and add CORS for adequate-mercy-production-31ee.up.railway.app")
  }
}
</script>
</body>
</html>
